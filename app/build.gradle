apply plugin: 'com.android.application'

android {
    namespace 'org.pocketworkstation.pckeyboard'
    compileSdk 37
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'app.escapekeyboard'
        minSdk 21
        targetSdk 37
        // The build number is the version code and the last part of the version name
        versionCode 183
        versionName "1.0.${versionCode}"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    // Upload key for Google Play, kept out of git: keystore.properties next to settings.gradle
    // (storeFile, storePassword, keyAlias, keyPassword). Without it release builds are
    // signed with the local debug key, which is only good for installing by hand.
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    // Keyboard layouts and dictionaries of every language live in language resources
    // (values-uk, raw-uk...): a Play language split would leave out the ones the device
    // language doesn't need, though any language can be typed
    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "4.1.2"
        }
    }
    productFlavors {
    }
    lint {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        //abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.emoji2:emoji2-emojipicker:1.5.0'
    implementation 'androidx.autofill:autofill:1.3.0'
}